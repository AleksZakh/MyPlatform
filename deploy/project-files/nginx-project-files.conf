# Optional location inside the existing HTTPS server block for Space.
# Preserve any authentication/access directives used by your existing API proxy.
# Place before other regex locations matching /api/work/.
# If /api/ is already configured with ^~, apply these settings there instead.
location ~ ^/api/work/projects/[0-9]+/files(?:/[0-9a-f-]+)?/?$ {
    client_max_body_size 100m;
    client_body_timeout 120s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3000;
}
# NO alias/root/public URL for WORK_PROJECT_FILES_ROOT: every download is authorized by Space.
