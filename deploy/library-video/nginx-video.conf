# Include INSIDE the existing HTTPS server block. Keep the existing / API proxy/auth setup.
# Root must match LIBRARY_FILES_ROOT + /video. This URL is never public.
location ^~ /_space-library-video/ {
    internal;
    alias /var/www/uploads-storage/library/video/;
    sendfile on;
    max_ranges 1;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
# Existing proxy location must accept PATCH and chunks of 8 MiB (client_max_body_size >= 9m).
# Do not add a new API proxy here: preserve existing headers, auth and routing.
# Enable LIBRARY_VIDEO_X_ACCEL=1 in space.env only AFTER nginx -t and nginx reload.
