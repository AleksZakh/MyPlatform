# Example only: adapt the upstream, keytab and principal to the existing HTTPS server.
# Do not replace your complete nginx configuration with this fragment.
location = /api/auth/kerberos {
    auth_gss on;
    auth_gss_keytab /etc/nginx/space.keytab;
    # Use the actual HTTP service principal from your keytab/configuration.
    auth_gss_service_name HTTP/space.corp.example.ru;
    auth_gss_allow_basic_fallback off;

    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # This value must come from verified GSS authentication, never $http_x_remote_user.
    proxy_set_header X-Remote-User $remote_user;
    proxy_set_header Remote-User "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header Authorization "";
    proxy_cache off;
}
# Also clear all three identity headers in other locations proxying to Nitro.
# Restrict the Nitro listener/network so clients cannot bypass this trusted proxy.
# Keep /api/auth/login and /api/_auth/session outside GSS-only protection.
# /api/_auth/session and login responses must not be cached by an upstream proxy.
